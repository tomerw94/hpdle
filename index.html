<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPdle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1f;
      color: #e8e0cc;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 20px 0 10px;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 2.4rem;
      color: #c9a84c;
      letter-spacing: 5px;
      text-shadow: 0 0 24px rgba(201,168,76,0.4);
    }

    .subtitle {
      color: #7a7a9a;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .game-area {
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Search ── */
    .search-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .autocomplete-wrapper {
      position: relative;
      flex: 1;
    }

    #search-input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a35;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      color: #e8e0cc;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input:focus { border-color: #c9a84c; }
    #search-input:disabled { opacity: 0.4; cursor: not-allowed; }

    .autocomplete-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a35;
      border: 1px solid #3a3a6a;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 210px;
      overflow-y: auto;
      z-index: 100;
    }

    .autocomplete-list.visible { display: block; }

    .autocomplete-item {
      padding: 9px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.12s;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active { background: #2a2a55; }

    #guess-btn {
      padding: 12px 26px;
      background: #c9a84c;
      color: #0d0d1f;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    #guess-btn:hover:not(:disabled) { background: #dfc06a; }
    #guess-btn:active:not(:disabled) { transform: scale(0.97); }
    #guess-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Win banner ── */
    #win-banner {
      display: none;
      text-align: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, #0d250d, #1a3a1a);
      border: 1px solid #4caf50;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #win-banner.visible { display: block; }

    #win-banner h2 {
      color: #66bb6a;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    #win-banner p { color: #81c784; font-size: 0.95rem; }

    /* ── Guess count ── */
    .guess-count {
      color: #5a5a7a;
      font-size: 0.82rem;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    /* ── Table ── */
    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
    }

    thead th {
      background: #181830;
      color: #6a6a9a;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 8px 10px;
      text-align: center;
      border-radius: 4px;
      font-family: Arial, sans-serif;
    }

    thead th:first-child { text-align: left; }

    tbody td {
      padding: 9px 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.88rem;
      vertical-align: middle;
      line-height: 1.3;
    }

    tbody td:first-child {
      text-align: left;
      font-weight: bold;
      background: #181830;
      white-space: nowrap;
      min-width: 140px;
    }

    .cell-green {
      background: #1b4a1f;
      color: #a5d6a7;
      border: 1px solid #4caf50;
    }

    .cell-orange {
      background: #4a2a00;
      color: #ffcc80;
      border: 1px solid #e65100;
    }

    .cell-red {
      background: #3a0f0f;
      color: #ef9a9a;
      border: 1px solid #b71c1c;
    }

    .arrow { margin-left: 4px; font-size: 1rem; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #181830; }
    ::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 3px; }

    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      tbody td { padding: 7px 6px; font-size: 0.78rem; }
      tbody td:first-child { min-width: 100px; font-size: 0.78rem; }
      #guess-btn { padding: 12px 14px; }
    }
  </style>
</head>

const BOOK_ORDER = [
  "Philosopher's Stone",
  "Chamber of Secrets",
  "Prisoner of Azkaban",
  "Goblet of Fire",
  "Order of the Phoenix",
  "Half-Blood Prince",
  "Deathly Hallows"
];

// ─── Daily target ─────────────────────────────────────────────────────────────
function getDailyTarget() {
  const EPOCH = new Date('2026-08-12');
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const day = Math.floor((today - EPOCH) / 86400000);
  return CHARACTERS[((day % CHARACTERS.length) + CHARACTERS.length) % CHARACTERS.length];
}

const TARGET = getDailyTarget();

// ─── State ────────────────────────────────────────────────────────────────────
const guesses = [];
let selectedName = null;
let activeIdx = -1;
let won = false;

// ─── Comparison ───────────────────────────────────────────────────────────────
function setsEqual(a, b) {
  return a.length === b.length && [...a].sort().join('|') === [...b].sort().join('|');
}

function setsOverlap(a, b) {
  return a.some(v => b.includes(v));
}

function compare(guess) {
  const t = TARGET;
  const gi = BOOK_ORDER.indexOf(guess.firstAppearance);
  const ti = BOOK_ORDER.indexOf(t.firstAppearance);
  return {
    gender:  guess.gender === t.gender ? 'green' : 'red',
    roles:   setsEqual(guess.roles, t.roles)   ? 'green' : setsOverlap(guess.roles, t.roles)   ? 'orange' : 'red',
    species: setsEqual(guess.species, t.species) ? 'green' : setsOverlap(guess.species, t.species) ? 'orange' : 'red',
    book: gi === ti ? { color: 'green', arrow: '' } : { color: 'red', arrow: gi < ti ? '↑' : '↓' }
  };
}

// ─── Render row ───────────────────────────────────────────────────────────────
function renderRow(char, res) {
  const tbody = document.getElementById('guess-tbody');
  const tr = document.createElement('tr');

  const tdName = document.createElement('td');
  tdName.textContent = char.name;
  tr.appendChild(tdName);

  function addCell(color, text, extra) {
    const td = document.createElement('td');
    td.className = 'cell-' + color;
    td.textContent = text;
    if (extra) {
      const sp = document.createElement('span');
      sp.className = 'arrow';
      sp.textContent = extra;
      td.appendChild(sp);
    }
    tr.appendChild(td);
  }

  addCell(res.gender,  char.gender,                    '');
  addCell(res.roles,   char.roles.join(', '),           '');
  addCell(res.species, char.species.join(', '),         '');
  addCell(res.book.color, char.firstAppearance, res.book.arrow);

  tbody.insertBefore(tr, tbody.firstChild);
}

function updateCount() {
  const el = document.getElementById('guess-count');
  const n = guesses.length;
  el.textContent = n > 0 ? `${n} guess${n === 1 ? '' : 'es'} so far` : '';
}

// ─── Autocomplete ─────────────────────────────────────────────────────────────
const input = document.getElementById('search-input');
const list  = document.getElementById('autocomplete-list');

function available() {
  const used = new Set(guesses.map(g => g.name));
  return CHARACTERS.map(c => c.name).filter(n => !used.has(n));
}

function showDropdown(query) {
  list.innerHTML = '';
  activeIdx = -1;
  const q = query.toLowerCase().trim();
  if (!q) { list.classList.remove('visible'); return; }
  const hits = available().filter(n => n.toLowerCase().includes(q)).slice(0, 8);
  if (!hits.length) { list.classList.remove('visible'); return; }
  hits.forEach(name => {
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.textContent = name;
    div.addEventListener('mousedown', e => { e.preventDefault(); pick(name); });
    list.appendChild(div);
  });
  list.classList.add('visible');
}

function pick(name) {
  selectedName = name;
  input.value = name;
  list.classList.remove('visible');
  activeIdx = -1;
}

input.addEventListener('input', () => {
  selectedName = null;
  showDropdown(input.value);
});

input.addEventListener('keydown', e => {
  const items = list.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    if (items[activeIdx]) selectedName = items[activeIdx].textContent;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    if (items[activeIdx]) selectedName = items[activeIdx].textContent;
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!selectedName) {
      const exact = available().find(n => n.toLowerCase() === input.value.trim().toLowerCase());
      if (exact) selectedName = exact;
    }
    if (selectedName) submitGuess();
  } else if (e.key === 'Escape') {
    list.classList.remove('visible');
  }
});

input.addEventListener('blur', () => setTimeout(() => list.classList.remove('visible'), 150));

// ─── Submit ───────────────────────────────────────────────────────────────────
function submitGuess() {
  if (!selectedName || won) return;
  const char = CHARACTERS.find(c => c.name === selectedName);
  if (!char || guesses.find(g => g.name === char.name)) return;

  const res = compare(char);
  guesses.push(char);
  renderRow(char, res);
  updateCount();
  input.value = '';
  selectedName = null;
  list.classList.remove('visible');

  if (res.gender === 'green' && res.roles === 'green' && res.species === 'green' && res.book.color === 'green') {
    won = true;
    const banner = document.getElementById('win-banner');
    const n = guesses.length;
    document.getElementById('win-message').textContent =
      `You found ${TARGET.name} in ${n} guess${n === 1 ? '' : 'es'}!`;
    banner.classList.add('visible');
    input.disabled = true;
    document.getElementById('guess-btn').disabled = true;
  }
}

document.getElementById('guess-btn').addEventListener('click', () => {
  if (!selectedName && input.value.trim()) {
    const exact = available().find(n => n.toLowerCase() === input.value.trim().toLowerCase());
    if (exact) selectedName = exact;
  }
  submitGuess();
});
</script>
