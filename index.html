<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPdle</title>
  <style>
    @font-face {
      font-family: 'HPfont';
      src: url('HPfont.TTF') format('truetype');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1f;
      color: #e8e0cc;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 20px 0 10px;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'HPfont', Georgia, serif;
      font-size: 2.4rem;
      color: #c9a84c;
      letter-spacing: 5px;
      text-shadow: 0 0 24px rgba(201,168,76,0.4);
    }

    .subtitle {
      color: #7a7a9a;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .game-area {
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Search ── */
    .search-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .autocomplete-wrapper {
      position: relative;
      flex: 1;
    }

    #search-input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a35;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      color: #e8e0cc;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #search-input:focus { border-color: #c9a84c; }
    #search-input:disabled { opacity: 0.4; cursor: not-allowed; }

    .autocomplete-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a35;
      border: 1px solid #3a3a6a;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 210px;
      overflow-y: auto;
      z-index: 100;
    }

    .autocomplete-list.visible { display: block; }

    .autocomplete-item {
      padding: 9px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.12s;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active { background: #2a2a55; }

    #guess-btn {
      padding: 12px 26px;
      background: #c9a84c;
      color: #0d0d1f;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    #guess-btn:hover:not(:disabled) { background: #dfc06a; }
    #guess-btn:active:not(:disabled) { transform: scale(0.97); }
    #guess-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Win banner ── */
    #win-banner {
      display: none;
      text-align: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, #0d250d, #1a3a1a);
      border: 1px solid #4caf50;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    #win-banner.visible { display: block; }

    #win-banner h2 {
      color: #66bb6a;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    #win-banner p { color: #81c784; font-size: 0.95rem; }
    #win-stats { font-size: 0.82rem; opacity: 0.85; margin-top: 4px; }

    /* ── Guess count ── */
    .guess-count {
      color: #5a5a7a;
      font-size: 0.82rem;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    /* ── Table ── */
    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
    }

    thead th {
      background: #181830;
      color: #6a6a9a;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 8px 10px;
      text-align: center;
      border-radius: 4px;
      font-family: Arial, sans-serif;
    }

    thead th:first-child { text-align: left; }

    tbody td {
      padding: 9px 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.88rem;
      vertical-align: middle;
      line-height: 1.3;
    }

    tbody td:first-child {
      text-align: left;
      font-weight: bold;
      background: #181830;
      white-space: nowrap;
      min-width: 140px;
    }

    .cell-green {
      background: #1b4a1f;
      color: #a5d6a7;
      border: 1px solid #4caf50;
    }

    .cell-orange {
      background: #4a2a00;
      color: #ffcc80;
      border: 1px solid #e65100;
    }

    .cell-red {
      background: #3a0f0f;
      color: #ef9a9a;
      border: 1px solid #b71c1c;
    }

    .arrow { margin-left: 4px; font-size: 1rem; }

    /* ── Stage-advance button (win banner) ── */
    .stage-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 22px;
      background: #c9a84c;
      color: #0d0d1f;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .stage-btn:hover { background: #dfc06a; }
    .stage-btn:active { transform: scale(0.97); }

    /* ── Stage 2: Spell Challenge ── */
    #stage2 {
      display: none;
      max-width: 960px;
      margin: 0 auto 40px;
      padding: 20px;
      background: #14142a;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
    }

    #stage2.visible { display: block; }

    .stage2-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 10px;
    }

    .stage2-header h2 {
      color: #c9a84c;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    .stage2-progress { color: #7a7a9a; font-size: 0.85rem; }

    .stage2-difficulty {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      background: #2a2a55;
      color: #b0b0d8;
    }

    .stage2-difficulty.Easy   { background: #1b4a1f; color: #a5d6a7; }
    .stage2-difficulty.Medium { background: #4a2a00; color: #ffcc80; }
    .stage2-difficulty.Hard   { background: #3a0f0f; color: #ef9a9a; }

    .stage2-prompt {
      font-size: 1.15rem;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .stage2-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stage2-option {
      padding: 12px 14px;
      background: #1a1a35;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      color: #e8e0cc;
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }

    .stage2-option:hover:not(:disabled) { border-color: #c9a84c; }
    .stage2-option:disabled { cursor: not-allowed; opacity: 0.75; }
    .stage2-option.correct { background: #1b4a1f; border-color: #4caf50; color: #a5d6a7; opacity: 1; }
    .stage2-option.wrong   { background: #3a0f0f; border-color: #b71c1c; color: #ef9a9a; opacity: 1; }

    .spell-card {
      background: #1a1a35;
      border: 1px solid #3a3a6a;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .spell-card h4 { color: #c9a84c; font-size: 1.05rem; margin-bottom: 6px; }
    .spell-card p { font-size: 0.88rem; margin-top: 6px; line-height: 1.4; color: #cfc9b8; }
    .spell-card p strong { color: #9a9ac0; }

    #stage2-result { display: none; }
    #stage2-result.visible { display: block; }
    #stage2-result h3 { font-size: 1.15rem; margin-bottom: 10px; }
    #stage2-result h3.win { color: #66bb6a; }
    #stage2-result h3.lose { color: #ef9a9a; }

    #stage2-summary { display: none; text-align: center; }
    #stage2-summary.visible { display: block; }
    #stage2-summary h3 { color: #c9a84c; font-size: 1.2rem; margin-bottom: 8px; }
    #stage2-summary p { font-size: 0.92rem; color: #b0b0d8; margin-top: 4px; }
    #stage2-summary p.summary-headline { margin-top: 16px; color: #e8e0cc; font-size: 0.98rem; }
    #stage2-summary p.summary-substat { font-size: 0.82rem; opacity: 0.85; }
    #stage2-summary-tomorrow { margin-top: 18px; padding-top: 14px; border-top: 1px solid #2a2a4a; color: #c9a84c; font-size: 0.95rem; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #181830; }
    ::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 3px; }

    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      tbody td { padding: 7px 6px; font-size: 0.78rem; }
      tbody td:first-child { min-width: 100px; font-size: 0.78rem; }
      #guess-btn { padding: 12px 14px; }
      .stage2-options { grid-template-columns: 1fr; }
    }
  </style>
</head>

</div>

<div id="stage2">

    <p id="stage2-summary-score" class="summary-headline"></p>
    <p id="stage2-summary-stats" class="summary-substat"></p>
    <p id="stage2-summary-tomorrow"></p>
  </div>
</div>

const DIFFICULTIES = ["Easy", "Medium", "Hard"];

// ─── Daily target ─────────────────────────────────────────────────────────────
function seededRNG(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0x100000000; };
}

function buildShuffledOrder(n, seed) {
  const rng = seededRNG(seed);
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const DAILY_ORDER = buildShuffledOrder(CHARACTERS.length, 0xC0FFEE42);

function getLocalToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function todayKey(d = getLocalToday()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDailyTarget() {
  const EPOCH = new Date('2026-08-12');
  const today = getLocalToday();
  const day = Math.floor((today - EPOCH) / 86400000);
  return CHARACTERS[DAILY_ORDER[((day % CHARACTERS.length) + CHARACTERS.length) % CHARACTERS.length]];
}

const TARGET = getDailyTarget();

// ─── Stage 2: daily spell questions ───────────────────────────────────────────
function dayNumber() {
  const EPOCH = new Date('2026-08-12');
  return Math.floor((getLocalToday() - EPOCH) / 86400000);
}

const SPELLS_BY_DIFFICULTY = {};
DIFFICULTIES.forEach(d => { SPELLS_BY_DIFFICULTY[d] = SPELLS.filter(s => s.difficulty === d); });

function pickDailySpell(difficulty, seed) {
  const group = SPELLS_BY_DIFFICULTY[difficulty];
  const order = buildShuffledOrder(group.length, seed);
  const day = dayNumber();
  return group[order[((day % group.length) + group.length) % group.length]];
}

function pickRandomDistinct(pool, n, rng) {
  const copy = pool.slice();
  const picked = [];
  for (let i = 0; i < n && copy.length; i++) {
    const idx = Math.floor(rng() * copy.length);
    picked.push(copy.splice(idx, 1)[0]);
  }
  return picked;
}

function buildStage2Question(step, seed) {
  const group = SPELLS_BY_DIFFICULTY[step.difficulty];
  const target = pickDailySpell(step.difficulty, seed);
  const rng = seededRNG((seed ^ (dayNumber() * 2654435761)) >>> 0);
  const decoys = pickRandomDistinct(group.filter(s => s.name !== target.name), 3, rng);
  const options = [target, ...decoys];
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return { difficulty: step.difficulty, promptField: step.promptField, answerField: step.answerField, target, options };
}

const STAGE2_SEEDS = { Easy: 0x5EED01, Medium: 0x5EED02, Hard: 0x5EED03 };
const STAGE2_STEPS = [
  { difficulty: 'Easy',   promptField: 'pronunciation', answerField: 'name' },
  { difficulty: 'Medium', promptField: 'name',          answerField: 'pronunciation' },
  { difficulty: 'Hard',   promptField: 'name',          answerField: 'pronunciation' }
];
const STAGE2_QUESTIONS = STAGE2_STEPS.map(step => buildStage2Question(step, STAGE2_SEEDS[step.difficulty]));

// ─── State ────────────────────────────────────────────────────────────────────
const guesses = [];
let selectedName = null;
let activeIdx = -1;
let won = false;
let statsRecorded = false;

let stage2Step = 0;
let stage2Results = []; // { correct, chosenName } for each completed step
let stage2CurrentAnswered = false;
let stage2CurrentChosenName = null;
let stage2Finished = false;
let stage2StatsRecorded = false;

// ─── Comparison ───────────────────────────────────────────────────────────────
function setsEqual(a, b) {
  return a.length === b.length && [...a].sort().join('|') === [...b].sort().join('|');
}

function setsOverlap(a, b) {
  return a.some(v => b.includes(v));
}

function compare(guess) {
  const t = TARGET;
  const gi = BOOK_ORDER.indexOf(guess.firstAppearance);
  const ti = BOOK_ORDER.indexOf(t.firstAppearance);
  return {
    gender:  guess.gender === t.gender ? 'green' : 'red',
    roles:   setsEqual(guess.roles, t.roles)   ? 'green' : setsOverlap(guess.roles, t.roles)   ? 'orange' : 'red',
    species: setsEqual(guess.species, t.species) ? 'green' : setsOverlap(guess.species, t.species) ? 'orange' : 'red',
    book: gi === ti ? { color: 'green', arrow: '' } : { color: 'red', arrow: gi < ti ? '↑' : '↓' }
  };
}

// ─── Render row ───────────────────────────────────────────────────────────────
function renderRow(char, res) {
  const tbody = document.getElementById('guess-tbody');
  const tr = document.createElement('tr');

  const tdName = document.createElement('td');
  tdName.textContent = char.name;
  tr.appendChild(tdName);

  function addCell(color, text, extra) {
    const td = document.createElement('td');
    td.className = 'cell-' + color;
    td.textContent = text;
    if (extra) {
      const sp = document.createElement('span');
      sp.className = 'arrow';
      sp.textContent = extra;
      td.appendChild(sp);
    }
    tr.appendChild(td);
  }

  addCell(res.gender,  char.gender,                    '');
  addCell(res.roles,   char.roles.join(', '),           '');
  addCell(res.species, char.species.join(', '),         '');
  addCell(res.book.color, char.firstAppearance, res.book.arrow);

  tbody.insertBefore(tr, tbody.firstChild);
}

function updateCount() {
  const el = document.getElementById('guess-count');
  const n = guesses.length;
  el.textContent = n > 0 ? `${n} guess${n === 1 ? '' : 'es'} so far` : '';
}

function showWinBanner(n) {
  const banner = document.getElementById('win-banner');
  document.getElementById('win-message').textContent =
    `You found ${TARGET.name} in ${n} guess${n === 1 ? '' : 'es'}!`;
  banner.classList.add('visible');
  input.disabled = true;
  document.getElementById('guess-btn').disabled = true;
  document.getElementById('stage2-start-btn').style.display = 'inline-block';
}

// ─── Persistence ──────────────────────────────────────────────────────────────
function storageKey() {
  return 'hpdle_progress_' + todayKey();
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(storageKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveProgress() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      guesses: guesses.map(g => g.name),
      won,
      statsRecorded
    }));
  } catch (e) {
    // localStorage unavailable/throwing (e.g. Safari private mode) — degrade to in-memory-only
  }
}

function restoreProgress() {
  const data = loadProgress();
  if (!data || !Array.isArray(data.guesses)) return;

  data.guesses.forEach(name => {
    const char = CHARACTERS.find(c => c.name === name);
    if (!char) return;
    if (guesses.find(g => g.name === char.name)) return;
    const res = compare(char);
    guesses.push(char);
    renderRow(char, res);
  });
  updateCount();

  if (data.won && guesses.length) {
    won = true;
    showWinBanner(guesses.length);
    statsRecorded = !!data.statsRecorded;
    if (!statsRecorded) {
      recordWinStats(guesses.length);
    } else {
      displayDailyStats();
    }
    restoreStage2Progress();
  }
}

// ─── Daily stats (Firebase) ───────────────────────────────────────────────────
function statsDocRef() {
  return doc(db, 'dailyStats', todayKey());
}

async function recordWinStats(n) {
  try {
    await setDoc(statsDocRef(), {
      solvedCount: increment(1),
      totalGuesses: increment(n)
    }, { merge: true });
    statsRecorded = true;
    saveProgress();
  } catch (e) {
    // write failed (offline/network/rules) — statsRecorded stays false, retried on next load
    console.error('recordWinStats failed:', e);
  }
  displayDailyStats();
}

async function displayDailyStats() {
  const el = document.getElementById('win-stats');
  if (!el) return;
  try {
    const snap = await getDoc(statsDocRef());
    if (!snap.exists()) { el.textContent = ''; return; }
    const { solvedCount, totalGuesses } = snap.data();
    if (!solvedCount) { el.textContent = ''; return; }
    const avg = (totalGuesses / solvedCount).toFixed(1);
    el.textContent = `${solvedCount} ${solvedCount === 1 ? 'person has' : 'people have'} solved today's puzzle so far, averaging ${avg} guesses.`;
  } catch (e) {
    el.textContent = '';
    console.error('displayDailyStats failed:', e);
  }
}

// ─── Stage 2: Spell Challenge ─────────────────────────────────────────────────
function stage2StorageKey() {
  return 'hpdle_stage2_' + todayKey();
}

function loadStage2Progress() {
  try {
    const raw = localStorage.getItem(stage2StorageKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveStage2Progress() {
  try {
    localStorage.setItem(stage2StorageKey(), JSON.stringify({
      step: stage2Step,
      results: stage2Results,
      currentAnswered: stage2CurrentAnswered,
      currentChosenName: stage2CurrentChosenName,
      finished: stage2Finished,
      statsRecorded: stage2StatsRecorded
    }));
  } catch (e) {
    // localStorage unavailable/throwing — degrade to in-memory-only
  }
}

function showStage2() {
  document.getElementById('stage2').classList.add('visible');
  document.querySelector('.game-area').style.display = 'none';
}

function renderStage2Question() {
  document.getElementById('stage2-question').style.display = '';
  document.getElementById('stage2-result').classList.remove('visible');
  document.getElementById('stage2-summary').classList.remove('visible');

  const q = STAGE2_QUESTIONS[stage2Step];
  document.getElementById('stage2-progress').textContent = `Step ${stage2Step + 1} of ${STAGE2_QUESTIONS.length}`;

  const diffLabel = document.getElementById('stage2-difficulty-label');
  diffLabel.textContent = q.difficulty;
  diffLabel.className = 'stage2-difficulty ' + q.difficulty;

  const promptEl = document.getElementById('stage2-prompt');
  promptEl.textContent = q.promptField === 'pronunciation'
    ? `Which spell has this pronunciation: "${q.target.pronunciation}"?`
    : `How is "${q.target.name}" pronounced?`;

  const optionsEl = document.getElementById('stage2-options');
  optionsEl.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'stage2-option';
    btn.textContent = opt[q.answerField];
    btn.addEventListener('click', () => selectStage2Option(opt));
    optionsEl.appendChild(btn);
  });
}

function selectStage2Option(chosen) {
  const q = STAGE2_QUESTIONS[stage2Step];
  const correct = chosen.name === q.target.name;

  stage2CurrentAnswered = true;
  stage2CurrentChosenName = chosen.name;
  stage2Results[stage2Step] = { correct, chosenName: chosen.name };
  saveStage2Progress();

  renderStage2Result(q, chosen.name, correct);
}

function renderStage2Result(q, chosenName, correct) {
  const optionsEl = document.getElementById('stage2-options');
  Array.from(optionsEl.children).forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === q.target[q.answerField]) btn.classList.add('correct');
    else if (btn.textContent === (q.options.find(o => o.name === chosenName) || {})[q.answerField]) btn.classList.add('wrong');
  });

  const titleEl = document.getElementById('stage2-result-title');
  titleEl.textContent = correct ? 'Well done!' : 'Not quite — here\'s the spell:';
  titleEl.className = correct ? 'win' : 'lose';

  const card = document.getElementById('stage2-spell-card');
  card.innerHTML = `
    <h4>${q.target.name}</h4>
    <p><strong>Pronunciation:</strong> ${q.target.pronunciation}</p>
    <p><strong>Description:</strong> ${q.target.description}</p>
    <p><strong>Seen / Mentioned:</strong> ${q.target.seen}</p>
  `;

  const nextBtn = document.getElementById('stage2-next-btn');
  const isLast = stage2Step === STAGE2_STEPS.length - 1;
  nextBtn.textContent = isLast ? 'Finish' : 'Next Level';
  nextBtn.onclick = isLast ? finishStage2 : advanceStage2;

  document.getElementById('stage2-result').classList.add('visible');
}

function advanceStage2() {
  stage2Step += 1;
  stage2CurrentAnswered = false;
  stage2CurrentChosenName = null;
  saveStage2Progress();
  renderStage2Question();
}

function stage2StatsDocRef() {
  return doc(db, 'dailyStats', todayKey());
}

function renderStage2Summary() {
  const correctCount = stage2Results.filter(r => r && r.correct).length;

  document.getElementById('stage2-question').style.display = 'none';
  document.getElementById('stage2-result').classList.remove('visible');

  document.getElementById('stage2-summary-character').textContent =
    `You found ${TARGET.name} in ${guesses.length} guess${guesses.length === 1 ? '' : 'es'}!`;
  document.getElementById('stage2-summary-score').textContent =
    `You got ${correctCount}/${STAGE2_STEPS.length} correct in the Spell Challenge!`;
  document.getElementById('stage2-summary-tomorrow').textContent =
    'Come back tomorrow for a new character and new spells!';

  document.getElementById('stage2-summary').classList.add('visible');

  displayStage1StatsForSummary();
  displayStage2Stats();

  return correctCount;
}

async function displayStage1StatsForSummary() {
  const el = document.getElementById('stage2-summary-character-stats');
  if (!el) return;
  try {
    const snap = await getDoc(statsDocRef());
    if (!snap.exists()) { el.textContent = ''; return; }
    const { solvedCount, totalGuesses } = snap.data();
    if (!solvedCount) { el.textContent = ''; return; }
    const avg = (totalGuesses / solvedCount).toFixed(1);
    el.textContent = `${solvedCount} ${solvedCount === 1 ? 'person has' : 'people have'} solved today's puzzle so far, averaging ${avg} guesses.`;
  } catch (e) {
    el.textContent = '';
    console.error('displayStage1StatsForSummary failed:', e);
  }
}

async function finishStage2() {
  stage2Finished = true;
  const correctCount = renderStage2Summary();

  if (!stage2StatsRecorded) {
    try {
      await setDoc(stage2StatsDocRef(), {
        stage2FinishedCount: increment(1),
        stage2CorrectAnswers: increment(correctCount),
        stage2TotalAnswers: increment(STAGE2_STEPS.length)
      }, { merge: true });
      stage2StatsRecorded = true;
    } catch (e) {
      // write failed (offline/network/rules) — statsRecorded stays false, retried on next load
      console.error('finishStage2 write failed:', e);
    }
    saveStage2Progress();
    displayStage2Stats();
  }
}

async function displayStage2Stats() {
  const el = document.getElementById('stage2-summary-stats');
  if (!el) return;
  try {
    const snap = await getDoc(stage2StatsDocRef());
    if (!snap.exists()) { el.textContent = ''; return; }
    const { stage2FinishedCount, stage2CorrectAnswers, stage2TotalAnswers } = snap.data();
    if (!stage2FinishedCount) { el.textContent = ''; return; }
    const pct = stage2TotalAnswers ? Math.round((stage2CorrectAnswers / stage2TotalAnswers) * 100) : 0;
    el.textContent = `${stage2FinishedCount} ${stage2FinishedCount === 1 ? 'person has' : 'people have'} finished the Spell Challenge today, answering ${pct}% correctly.`;
  } catch (e) {
    el.textContent = '';
    console.error('displayStage2Stats failed:', e);
  }
}

function restoreStage2Progress() {
  const data = loadStage2Progress();
  if (!data) return;

  showStage2();
  stage2Step = data.step || 0;
  stage2Results = Array.isArray(data.results) ? data.results : [];
  stage2CurrentAnswered = !!data.currentAnswered;
  stage2CurrentChosenName = data.currentChosenName || null;
  stage2Finished = !!data.finished;
  stage2StatsRecorded = !!data.statsRecorded;

  if (stage2Finished) {
    if (!stage2StatsRecorded) {
      finishStage2();
    } else {
      renderStage2Summary();
    }
    return;
  }

  renderStage2Question();
  if (stage2CurrentAnswered && stage2CurrentChosenName) {
    const q = STAGE2_QUESTIONS[stage2Step];
    renderStage2Result(q, stage2CurrentChosenName, stage2CurrentChosenName === q.target.name);
  }
}

document.getElementById('stage2-start-btn').addEventListener('click', () => {
  showStage2();
  renderStage2Question();
  document.getElementById('stage2').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ─── Autocomplete ─────────────────────────────────────────────────────────────
const input = document.getElementById('search-input');
const list  = document.getElementById('autocomplete-list');

function available() {
  const used = new Set(guesses.map(g => g.name));
  return CHARACTERS.map(c => c.name).filter(n => !used.has(n));
}

function showDropdown(query) {
  list.innerHTML = '';
  activeIdx = -1;
  const q = query.toLowerCase().trim();
  if (!q) { list.classList.remove('visible'); return; }
  const hits = available().filter(n => n.toLowerCase().includes(q)).slice(0, 8);
  if (!hits.length) { list.classList.remove('visible'); return; }
  hits.forEach(name => {
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.textContent = name;
    div.addEventListener('mousedown', e => { e.preventDefault(); pick(name); });
    list.appendChild(div);
  });
  list.classList.add('visible');
}

function pick(name) {
  selectedName = name;
  input.value = name;
  list.classList.remove('visible');
  activeIdx = -1;
}

input.addEventListener('input', () => {
  selectedName = null;
  showDropdown(input.value);
});

input.addEventListener('keydown', e => {
  const items = list.querySelectorAll('.autocomplete-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    if (items[activeIdx]) selectedName = items[activeIdx].textContent;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    if (items[activeIdx]) selectedName = items[activeIdx].textContent;
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!selectedName) {
      const exact = available().find(n => n.toLowerCase() === input.value.trim().toLowerCase());
      if (exact) selectedName = exact;
    }
    if (selectedName) submitGuess();
  } else if (e.key === 'Escape') {
    list.classList.remove('visible');
  }
});

input.addEventListener('blur', () => setTimeout(() => list.classList.remove('visible'), 150));

// ─── Submit ───────────────────────────────────────────────────────────────────
function submitGuess() {
  if (!selectedName || won) return;
  const char = CHARACTERS.find(c => c.name === selectedName);
  if (!char || guesses.find(g => g.name === char.name)) return;

  const res = compare(char);
  guesses.push(char);
  renderRow(char, res);
  updateCount();
  input.value = '';
  selectedName = null;
  list.classList.remove('visible');

  if (char.name === TARGET.name) {
    won = true;
    showWinBanner(guesses.length);
  }

  saveProgress();

  if (won) {
    recordWinStats(guesses.length);
  }
}

document.getElementById('guess-btn').addEventListener('click', () => {
  if (!selectedName && input.value.trim()) {
    const exact = available().find(n => n.toLowerCase() === input.value.trim().toLowerCase());
    if (exact) selectedName = exact;
  }
  submitGuess();
});

restoreProgress();
